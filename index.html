\"168\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,168 28,163 28,173\" fill=\"#1f2937\"/><polygon points=\"364,168 352,163 352,173\" fill=\"#1f2937\"/><polygon points=\"310,168 296,162 296,174\" fill=\"#dc2626\"/><line x1=\"246.0\" y1=\"24\" x2=\"140.7\" y2=\"221\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"246.0,20 241.0,33 252.0,33\" fill=\"#1f2937\" transform=\"rotate(0)\"/><polygon points=\"140.7,225 134.7,212 145.7,212\" fill=\"#1f2937\"/><text x=\"215.6\" y=\"73\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">(3x − 7)°<\/text><text x=\"169.6\" y=\"159\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">(x + 5)°<\/text><\/svg>"},"reasons":["Given","Addition Property of Equality","Subtraction Property of Equality","Multiplication Property of Equality","Division Property of Equality","Substitution Property of Equality","Distributive Property","Simplify (combine like terms)","Reflexive Property of Equality","Symmetric Property of Equality","Transitive Property of Equality","Segment Addition Postulate","Angle Addition Postulate","Definition of congruence","Definition of perpendicular","Definition of congruent segments","Definition of congruent angles","Reflexive Property of Congruence","Symmetric Property of Congruence","Transitive Property of Congruence","Definition of midpoint","Definition of angle bisector","Definition of complementary angles","Definition of supplementary angles","Definition of right angles","Linear Pair Postulate","Definition of vertical angles","Vertical Angles Congruence Theorem","Congruent Supplements Theorem","Congruent Complements Theorem","Right Angles Congruence Theorem","Corresponding Angles Postulate","Alternate Interior Angles Theorem","Alternate Exterior Angles Theorem","Consecutive Interior Angles Theorem","Definition of linear pair","Parallel Postulate","Perpendicular Postulate"]}</script>
<script>
(function () {
  'use strict';
  var D;
  try { D = JSON.parse(document.getElementById('data').textContent); }
  catch (err) { document.getElementById('app').textContent = 'Could not load the guide data: ' + err.message; return; }

  var COL = ['#60a5fa', '#34d399', '#fbbf24', '#c084fc', '#fb7185', '#2dd4bf'];
  var S = { view: 'home', sec: 0, tab: 'learn', fl: { sec: -1, i: 0, flip: false, order: null }, T: null };
  var ST = {}, Q = {}, SAVED = {};
  try { SAVED = JSON.parse(localStorage.getItem('geo3_solved') || '{}') || {}; } catch (e) { SAVED = {}; }
  function save() { try { localStorage.setItem('geo3_solved', JSON.stringify(SAVED)); } catch (e) {} }

  // register every question under an id
  D.sections.forEach(function (sec, si) {
    sec.topics.forEach(function (t, ti) { t.check.sec = si; Q['c' + si + '_' + ti] = t.check; });
    sec.sets.forEach(function (set, a) { set.probs.forEach(function (p, b) { p.sec = si; Q['p' + si + '_' + a + '_' + b] = p; }); });
  });
  D.tests.forEach(function (t, ti) { t.qs.forEach(function (q, qi) { Q['t' + ti + '_' + qi] = q; }); });

  function $(id) { return document.getElementById(id); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function attr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  // ---------- answer checking
  function norm(s) {
    s = String(s).toLowerCase().replace(/[−–—]/g, '-').replace(/[\s °]/g, '')
      .replace(/[()·*×]/g, '').replace(/</g, '∠').replace(/m∠/g, 'm').replace(/\.$/, '');
    var m = s.match(/^[a-z]=([-+]?[\d.\/]+)$/);
    if (m) s = m[1];
    return s;
  }
  function numval(s) {
    var m = s.match(/^([+-]?\d*\.?\d+)(?:\/(\d+))?$/);
    if (!m) return null;
    var v = parseFloat(m[1]);
    if (m[2]) { if (parseFloat(m[2]) === 0) return null; v = v / parseFloat(m[2]); }
    return v;
  }
  function textOK(q, val) {
    var u = norm(val);
    if (!u) return false;
    for (var i = 0; i < q.accept.length; i++) {
      var a = norm(q.accept[i]);
      if (u === a) return true;
      var nu = numval(u), na = numval(a);
      if (nu !== null && na !== null && Math.abs(nu - na) < 1e-6) return true;
    }
    return false;
  }

  // ---------- rendering pieces
  function figHTML(q) {
    var h = '';
    if (q.img && D.img[q.img]) h += '<div class="fig"><img src="' + D.img[q.img] + '" alt="diagram for this question"></div>';
    if (q.svg && D.svg[q.svg]) h += '<div class="fig">' + D.svg[q.svg] + '</div>';
    return h;
  }
  function stepsHTML(q) { return q.steps ? '<div class="steps"><b>How to solve it</b><div>' + q.steps + '</div></div>' : ''; }

  function card(id) {
    var q = Q[id], st = ST[id] || (ST[id] = {}), isTest = id.charAt(0) === 't';
    var cls = 'q' + (st.done || st.gotit ? (st.ok ? ' ok' : ' bad') : '');
    var h = '<div class="' + cls + '" id="q_' + id + '"><div class="qh">' + (q.num ? '<span class="num">' + q.num + '</span>' : '') + '<div class="qt">' + q.q + '</div></div>' + figHTML(q);
    if (q.t === 'mc' || q.t === 'tf') {
      var ord = (isTest && S.T && S.T.perm && S.T.perm[+id.split('_')[1]]) || q.opts.map(function (_, i) { return i; });
      h += '<div class="opts">';
      ord.forEach(function (i) {
        var c = 'opt';
        if (st.done) { if (i === q.ans) c += ' right'; else if (i === st.sel) c += ' wrong'; }
        h += '<button class="' + c + '" data-act="pick" data-id="' + id + '" data-i="' + i + '"' + (st.done ? ' disabled' : '') + '>' + q.opts[i] + '</button>';
      });
      h += '</div>';
    } else if (q.t === 'text') {
      h += '<div class="row"><input class="ti" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-id="' + id + '" placeholder="Type your answer" value="' + attr(st.val || '') + '"' + (st.done ? ' disabled' : '') + '>' +
        '<button class="btn sm" data-act="check" data-id="' + id + '"' + (st.done ? ' disabled' : '') + '>Check</button></div>';
    } else if (q.t === 'proof') {
      h += '<table class="proof"><tr><th>Statement</th><th>Reason</th></tr>';
      q.rows.forEach(function (r, ri) {
        var rc = st.done ? (st.rowOk[ri] ? ' class="rok"' : ' class="rbad"') : '';
        h += '<tr' + rc + '><td>' + (ri + 1) + '. ' + r.s + '</td><td>';
        if (r.fixed) h += 'Given';
        else {
          h += '<select data-act="psel" data-id="' + id + '" data-r="' + ri + '"' + (st.done ? ' disabled' : '') + '><option value="">Choose a reason</option>';
          D.reasons.forEach(function (x) { h += '<option value="' + attr(x) + '"' + ((st.sel && st.sel[ri] === x) ? ' selected' : '') + '>' + x + '</option>'; });
          h += '</select>';
          if (st.done && !st.rowOk[ri]) h += '<div class="why">Correct reason: <b>' + r.r[0] + '</b></div>';
        }
        if (st.done) h += '<div class="why">' + r.why + '</div>';
        h += '</td></tr>';
      });
      h += '</table>';
      if (!st.done) h += '<div class="row"><button class="btn sm" data-act="check" data-id="' + id + '">Check my reasons</button></div>';
    } else if (q.t === 'open') {
      if (!st.shown) h += '<div class="row"><button class="btn sm" data-act="reveal" data-id="' + id + '">Show answer and steps</button></div>';
      else {
        h += '<div class="ans"><b>Answer</b><div>' + q.answer + '</div>' + (q.ansvg && D.svg[q.ansvg] ? '<div class="fig">' + D.svg[q.ansvg] + '</div>' : '') + '</div>' + stepsHTML(q);
        h += '<div class="row">' + (st.gotit ? '<span class="fb ok">Marked as solved</span>' : '<button class="btn sm" data-act="gotit" data-id="' + id + '">I got it</button>') +
          '<button class="btn ghost sm" data-act="retry" data-id="' + id + '">Hide</button></div>';
      }
    }
    if (q.t !== 'open' && st.done) {
      if (q.t === 'proof') h += '<div class="fb ' + (st.ok ? 'ok' : 'bad') + '">' + (st.ok ? 'Every reason is correct.' : 'Some reasons need another look. The right ones are shown above.') + '</div>';
      else h += '<div class="fb ' + (st.ok ? 'ok' : 'bad') + '">' + (st.ok ? 'Correct!' : 'Not quite.') + (q.t === 'text' && !st.ok ? ' Answer: <b>' + q.show + '</b>' : '') + '</div>' + stepsHTML(q);
      if (!isTest) h += '<div class="row"><button class="btn ghost sm" data-act="retry" data-id="' + id + '">Try again</button></div>';
    }
    return h + '</div>';
  }

  function refresh(id) {
    var el = $('q_' + id);
    if (!el) return;
    var t = document.createElement('div');
    t.innerHTML = card(id);
    el.replaceWith(t.firstChild);
    updateProgress();
  }

  function solvedCount(si) {
    var tot = 0, done = 0;
    D.sections[si].sets.forEach(function (set, a) { set.probs.forEach(function (p, b) { tot++; if (SAVED['p' + si + '_' + a + '_' + b]) done++; }); });
    return { total: tot, solved: done };
  }
  function updateProgress() {
    var el = $('pcount'); if (!el) return;
    var s = solvedCount(S.sec);
    el.textContent = s.solved + ' of ' + s.total + ' practice problems solved';
  }

  // ---------- nav and views
  function nav() {
    var items = [['home', 'Home']];
    D.sections.forEach(function (s, i) { items.push(['sec' + i, s.id + (s.new ? ' <span class="newb">NEW</span>' : '')]); });
    items.push(['flash', 'Flashcards'], ['tests', 'Practice tests']);
    var cur = S.view === 'section' ? 'sec' + S.sec : (S.view === 'test' || S.view === 'results' ? 'tests' : S.view);
    $('nav').innerHTML = '<span class="logo">📐 Geometry 3.1 &amp; 3.2</span>' + items.map(function (it) {
      var c = it[0].indexOf('sec') === 0 ? COL[+it[0].slice(3)] : (it[0] === 'flash' ? '#fbbf24' : (it[0] === 'tests' ? '#f472b6' : '#e9ecf3'));
      return '<button class="nb' + (cur === it[0] ? ' on' : '') + '" style="--c:' + c + '" data-act="go" data-to="' + it[0] + '">' + it[1] + '</button>';
    }).join('');
  }

  function home() {
    var h = '<div class="hero"><h1>Geometry 3.1 and 3.2 Quiz Guide</h1><p>Sections 3.1 (pairs of lines and angles) and 3.2 (parallel lines and transversals), plus the Quiz Review sheet, built from your class notes, homework, proof practice and review slides. Every problem shows how to get the answer.</p></div>' +
      '<div class="howto"><div><b>1. Learn it</b><span>Short lessons with a check-in after each idea.</span></div><div><b>2. Practice it</b><span>Problems from class. Check your answer, then see the steps.</span></div><div><b>3. Test yourself</b><span>3 practice tests that tell you which section to review.</span></div></div><div class="seccards">';
    D.sections.forEach(function (s, i) {
      var st = solvedCount(i);
      h += '<button class="sc" style="--c:' + COL[i] + '" data-act="go" data-to="sec' + i + '"><div class="id">' + (s.id === 'Review' ? 'Quiz review' : 'Section ' + s.id) + (s.new ? ' <span class="newb">NEW</span>' : '') + '</div><h3>' + s.title + '</h3><p>' + s.blurb + '</p><div class="bar"><i style="width:' + (st.total ? 100 * st.solved / st.total : 0) + '%"></i></div><div class="small">' + st.solved + ' of ' + st.total + ' practice problems solved</div></button>';
    });
    h += '</div><div class="wide"><button class="sc" style="--c:#fbbf24" data-act="go" data-to="flash"><h3>🃏 Flashcards</h3><p>' + D.flash.length + ' key terms and rules. Tap to flip.</p></button>' +
      '<button class="sc" style="--c:#f472b6" data-act="go" data-to="tests"><h3>📝 Practice tests</h3><p>3 tests, 20 questions each, with full solutions.</p></button></div>';
    return h;
  }

  function section() {
    var si = S.sec, s = D.sections[si], np = solvedCount(si).total;
    var h = '<div style="--c:' + COL[si] + '"><div class="sechead"><div class="id">' + (s.id === 'Review' ? 'Quiz review' : 'Section ' + s.id) + '</div><h2>' + s.title + '</h2><div class="small" id="pcount"></div></div>' +
      '<div class="tabs"><button class="tab' + (S.tab === 'learn' ? ' on' : '') + '" data-act="tab" data-t="learn">1. Learn it</button><button class="tab' + (S.tab === 'practice' ? ' on' : '') + '" data-act="tab" data-t="practice">2. Practice problems (' + np + ')</button></div>';
    if (S.tab === 'learn') {
      s.topics.forEach(function (t, ti) {
        h += '<div class="topic"><h3><span class="n">' + (ti + 1) + '/' + s.topics.length + '</span>' + t.h + '</h3><div class="content">' + t.body + '</div>' + card('c' + si + '_' + ti) + '</div>';
      });
      h += '<div class="navrow"><span></span><button class="btn" data-act="tab" data-t="practice">Next: practice problems</button></div>';
    } else {
      s.sets.forEach(function (set, a) {
        h += '<div class="setbox"><h3>' + set.title + '</h3>' + (set.note ? '<div class="small">' + set.note + '</div>' : '');
        set.probs.forEach(function (p, b) { h += card('p' + si + '_' + a + '_' + b); });
        h += '</div>';
      });
      var nx = si < D.sections.length - 1 ? '<button class="btn" data-act="go" data-to="sec' + (si + 1) + '">Next section: ' + D.sections[si + 1].id + '</button>' : '<button class="btn" data-act="go" data-to="tests">Take a practice test</button>';
      h += '<div class="navrow"><button class="btn ghost" data-act="tab" data-t="learn">Back to lessons</button>' + nx + '</div>';
    }
    return h + '</div>';
  }

  // ---------- flashcards
  function flashOrder() {
    var f = S.fl;
    var idx = [];
    D.flash.forEach(function (c, i) { if (f.sec < 0 || c.sec === f.sec) idx.push(i); });
    if (f.order && f.sig === f.sec) { return f.order; }
    f.order = idx; f.sig = f.sec;
    return idx;
  }
  function flash() {
    var f = S.fl, idx = flashOrder();
    if (f.i >= idx.length) f.i = 0;
    var c = D.flash[idx[f.i]];
    var h = '<div class="sechead" style="--c:#fbbf24"><div class="id">Flashcards</div><h2>Key terms and rules</h2></div><div class="chips">';
    [[-1, 'All']].concat(D.sections.map(function (s, i) { return [i, s.id]; })).forEach(function (x) { h += '<button class="chip' + (f.sec === x[0] ? ' on' : '') + '" data-act="fsec" data-s="' + x[0] + '">' + x[1] + '</button>'; });
    h += '</div><div class="small">Card ' + (f.i + 1) + ' of ' + idx.length + ' &middot; section ' + D.sections[c.sec].id + '</div><div class="fl"><button class="fcard' + (f.flip ? ' back' : '') + '" style="--c:' + COL[c.sec] + '" data-act="flip">' +
      '<div>' + (f.flip ? c.back + '<small>tap to flip back</small>' : c.front + '<small>tap to see the answer</small>') + '</div></button></div>' +
      '<div class="navrow"><button class="btn ghost" data-act="fprev">Previous</button><button class="btn ghost" data-act="fshuf">Shuffle</button><button class="btn" data-act="fnext">Next</button></div>';
    return h;
  }

  // ---------- tests
  function bestKey(ti) { return 'best' + ti; }
  function testsList() {
    var h = '<div class="sechead" style="--c:#f472b6"><div class="id">Practice tests</div><h2>3 tests, 20 questions each</h2><div class="small">Each test has questions from both sections (3.1 and 3.2). You get a score for each section at the end, with a link to review the ones you missed.</div></div><div class="seccards">';
    D.tests.forEach(function (t, ti) {
      var b = SAVED[bestKey(ti)];
      h += '<button class="sc" style="--c:#f472b6" data-act="start" data-t="' + ti + '"><div class="id">Test ' + (ti + 1) + '</div><h3>' + t.qs.length + ' questions</h3><p>' + (b !== undefined ? 'Best score: ' + b + ' / ' + t.qs.length : 'Not taken yet') + '</p></button>';
    });
    return h + '</div>';
  }
  function startTest(ti) {
    var t = D.tests[ti];
    t.qs.forEach(function (q, qi) { delete ST['t' + ti + '_' + qi]; });
    S.T = { ti: ti, i: 0, res: [], perm: t.qs.map(function (q) { if (q.t === 'mc') { var a = q.opts.map(function (_, i) { return i; }); return shuffle(a); } return null; }) };
    S.view = 'test'; render();
  }
  function testView() {
    var T = S.T, t = D.tests[T.ti], id = 't' + T.ti + '_' + T.i, st = ST[id] || {};
    var h = '<div class="tprog"><b>' + t.title + '</b><span>Question ' + (T.i + 1) + ' of ' + t.qs.length + ' &middot; section ' + D.sections[t.qs[T.i].sec].id + '</span></div><div class="bar" style="--c:#f472b6"><i style="width:' + (100 * T.i / t.qs.length) + '%"></i></div>' + card(id);
    var last = T.i === t.qs.length - 1;
    h += '<div class="navrow"><button class="btn ghost" data-act="go" data-to="tests">Quit test</button><button class="btn" data-act="tnext"' + ((st.done || st.gotit) ? '' : ' disabled') + '>' + (last ? 'See results' : 'Next question') + '</button></div>';
    return h;
  }
  function results() {
    var T = S.T, t = D.tests[T.ti], total = 0, per = D.sections.map(function () { return [0, 0, []]; });
    t.qs.forEach(function (q, qi) { per[q.sec][1]++; if (T.res[qi]) { total++; per[q.sec][0]++; } else per[q.sec][2].push(qi); });
    var h = '<div class="sechead" style="--c:#f472b6"><div class="id">' + t.title + ' results</div><div class="score">' + total + ' / ' + t.qs.length + '</div><div class="small">' + Math.round(100 * total / t.qs.length) + '%</div></div><div class="secres">';
    per.forEach(function (p, si) {
      if (!p[1]) return;
      h += '<div style="--c:' + COL[si] + '"><b>' + (D.sections[si].id === 'Review' ? 'Quiz Review' : 'Section ' + D.sections[si].id) + ': ' + p[0] + ' of ' + p[1] + '</b><div class="bar" style="margin:6px 0"><i style="width:' + (p[1] ? 100 * p[0] / p[1] : 0) + '%"></i></div>';
      if (p[2].length) {
        h += '<div class="small">Missed:</div><ul class="miss">' + p[2].map(function (qi) { return '<li>' + t.qs[qi].q.replace(/<[^>]+>/g, '') + '</li>'; }).join('') + '</ul>';
        h += '<div class="row"><button class="btn sm" data-act="review" data-s="' + si + '">Review ' + D.sections[si].id + '</button></div>';
      } else h += '<div class="small">Perfect in this section.</div>';
      h += '</div>';
    });
    h += '</div><div class="navrow"><button class="btn ghost" data-act="go" data-to="tests">All tests</button><button class="btn" data-act="start" data-t="' + T.ti + '">Retake this test</button></div>';
    return h;
  }

  function render() {
    nav();
    var app = $('app');
    if (S.view === 'home') app.innerHTML = home();
    else if (S.view === 'section') { app.innerHTML = section(); updateProgress(); }
    else if (S.view === 'flash') app.innerHTML = flash();
    else if (S.view === 'tests') app.innerHTML = testsList();
    else if (S.view === 'test') app.innerHTML = testView();
    else if (S.view === 'results') app.innerHTML = results();
  }
  function go(to) {
    if (to.indexOf('sec') === 0) { S.view = 'section'; S.sec = +to.slice(3); S.tab = 'learn'; }
    else S.view = to;
    render(); window.scrollTo(0, 0);
  }

  // ---------- actions
  function finish(id, ok) {
    var st = ST[id]; st.done = true; st.ok = ok;
    if (id.charAt(0) === 't') { var p = id.split('_'); S.T.res[+p[1]] = ok; }
    else if (ok) { SAVED[id] = 1; save(); }
  }
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT') return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), q = id ? Q[id] : null, st = id ? (ST[id] || (ST[id] = {})) : null;
    if (act === 'go') go(el.getAttribute('data-to'));
    else if (act === 'tab') { S.tab = el.getAttribute('data-t'); render(); window.scrollTo(0, 0); }
    else if (act === 'pick') { if (st.done) return; st.sel = +el.getAttribute('data-i'); finish(id, st.sel === q.ans); refresh(id); if (S.view === 'test') render2(); }
    else if (act === 'check') {
      if (st.done) return;
      if (q.t === 'text') { var inp = document.querySelector('input.ti[data-id="' + id + '"]'); st.val = inp ? inp.value : st.val; if (!st.val || !String(st.val).trim()) return; finish(id, textOK(q, st.val)); }
      else if (q.t === 'proof') {
        st.rowOk = []; var all = true;
        q.rows.forEach(function (r, ri) { var ok = r.fixed || (st.sel && r.r.indexOf(st.sel[ri]) >= 0); st.rowOk[ri] = !!ok; if (!ok) all = false; });
        finish(id, all);
      }
      refresh(id); if (S.view === 'test') render2();
    }
    else if (act === 'reveal') { st.shown = true; refresh(id); }
    else if (act === 'gotit') { st.gotit = true; st.ok = true; if (id.charAt(0) === 't') { S.T.res[+id.split('_')[1]] = true; } else { SAVED[id] = 1; save(); } refresh(id); if (S.view === 'test') render2(); }
    else if (act === 'retry') { delete ST[id]; if (id.charAt(0) !== 't') { delete SAVED[id]; save(); } refresh(id); }
    else if (act === 'fsec') { S.fl.sec = +el.getAttribute('data-s'); S.fl.i = 0; S.fl.flip = false; S.fl.order = null; render(); }
    else if (act === 'flip') { S.fl.flip = !S.fl.flip; render(); }
    else if (act === 'fnext') { S.fl.i = (S.fl.i + 1) % flashOrder().length; S.fl.flip = false; render(); }
    else if (act === 'fprev') { var n = flashOrder().length; S.fl.i = (S.fl.i - 1 + n) % n; S.fl.flip = false; render(); }
    else if (act === 'fshuf') { S.fl.order = shuffle(flashOrder().slice()); S.fl.i = 0; S.fl.flip = false; render(); }
    else if (act === 'start') startTest(+el.getAttribute('data-t'));
    else if (act === 'tnext') {
      var T = S.T, tt = D.tests[T.ti];
      if (T.i < tt.qs.length - 1) { T.i++; S.view = 'test'; } else { S.view = 'results'; var best = SAVED[bestKey(T.ti)], sc = T.res.filter(Boolean).length; if (best === undefined || sc > best) { SAVED[bestKey(T.ti)] = sc; save(); } }
      render(); window.scrollTo(0, 0);
    }
    else if (act === 'review') { S.view = 'section'; S.sec = +el.getAttribute('data-s'); S.tab = 'learn'; render(); window.scrollTo(0, 0); }
  }
  // enable the Next button without re-rendering the question the student is reading
  function render2() {
    var b = document.querySelector('[data-act="tnext"]');
    if (b) b.removeAttribute('disabled');
  }
  function onChange(e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'psel') {
      var id = el.getAttribute('data-id'), st = ST[id] || (ST[id] = {});
      st.sel = st.sel || []; st.sel[+el.getAttribute('data-r')] = el.value;
    }
  }
  function onInput(e) {
    var el = e.target;
    if (el.classList && el.classList.contains('ti')) { var id = el.getAttribute('data-id'); (ST[id] || (ST[id] = {})).val = el.value; }
  }
  function onKey(e) {
    var el = e.target;
    if (e.key === 'Enter' && el.classList && el.classList.contains('ti')) {
      var b = document.querySelector('[data-act="check"][data-id="' + el.getAttribute('data-id') + '"]');
      if (b) b.click();
    }
  }
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  render();
})();
</script>
</body>
</html>
