<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometry 3.1 and 3.2 Quiz Guide</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2639;--line:#2a3550;--ink:#e9ecf3;--mute:#9aa6bf;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--blue:#60a5fa;--r:14px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 14px;background:rgba(15,20,32,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.logo{font-weight:700;white-space:nowrap;margin-right:6px}
.nb{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px}
.nb.on{background:var(--c,#60a5fa);border-color:var(--c,#60a5fa);color:#0b1020;font-weight:700}
main{max-width:860px;margin:0 auto;padding:18px 16px 70px}
h1,h2,h3{line-height:1.2;margin:0 0 10px}.newb{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:99px;background:#fbbf24;color:#1a1d26;vertical-align:middle;margin-left:4px}
.hero{padding:22px 18px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,#1b2742,#16213a);margin-bottom:16px}
.hero h1{font-size:28px}
.hero p{margin:6px 0 0;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.howto>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.howto b{display:block}.howto span{color:var(--mute);font-size:14px}
.seccards,.wide{display:grid;gap:12px;margin-bottom:12px}
.seccards{grid-template-columns:repeat(3,1fr)}
.wide{grid-template-columns:repeat(2,1fr)}
.sc{text-align:left;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:14px}
.sc:hover{background:var(--panel2)}
.sc .id{color:var(--c);font-weight:800;font-size:22px}
.sc h3{font-size:17px;margin:2px 0 6px}
.sc p{margin:0 0 8px;color:var(--mute);font-size:14px}
.bar{height:7px;border-radius:99px;background:#26324d;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.small{font-size:13px;color:var(--mute);margin-top:4px}
.sechead{border-left:6px solid var(--c);padding-left:12px;margin-bottom:12px}
.sechead .id{color:var(--c);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px}
.tab.on{background:var(--c);border-color:var(--c);color:#0b1020;font-weight:700}
.topic,.setbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.topic h3 .n{display:inline-block;background:var(--c);color:#0b1020;font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;margin-right:8px;vertical-align:2px}
.content p{margin:0 0 10px}.content ul,.content ol{margin:0 0 10px;padding-left:22px}.content li{margin-bottom:4px}
.hl{color:var(--warn);font-weight:700}
.t{color:var(--ok)}.f{color:var(--bad)}
.tip{background:#1f2a43;border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2)}
.fig{background:#fff;border-radius:10px;padding:8px;margin:10px 0;text-align:center;overflow-x:auto}
.fig img{max-width:100%;height:auto;vertical-align:middle}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}
.q.ok{border-color:#1f6f55}.q.bad{border-color:#7b3a3a}
.qh{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;background:#26324d;border-radius:8px;padding:1px 8px;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap}
.qt{flex:1}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;background:#121a2b;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:#12332b}
.opt.wrong{border-color:var(--bad);background:#3a1d22}
.opt:disabled{cursor:default;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ti{flex:1;min-width:150px;background:#121a2b;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.btn{background:var(--blue);border:0;color:#0b1020;font-weight:700;border-radius:10px;padding:9px 16px}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:8px 12px;border-radius:9px;font-weight:600}
.fb.ok{background:#12332b;color:#8ef0c7}.fb.bad{background:#3a1d22;color:#ffb4b4}
.steps,.ans{margin-top:10px;background:#141c2d;border:1px dashed #3a4a70;border-radius:10px;padding:10px 12px}
.steps>b,.ans>b{display:block;color:var(--warn);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.proof{width:100%;border-collapse:collapse;margin-top:10px}
.proof td,.proof th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;font-size:15px}
.proof th{background:#121a2b;text-align:left}
.proof select{width:100%;background:#121a2b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:14px}
.proof tr.rok td:last-child{background:#12332b}.proof tr.rbad td:last-child{background:#3a1d22}
.why{font-size:13px;color:var(--mute);margin-top:3px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.tprog{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:6px}
.fl{perspective:900px;margin:14px 0}
.fcard{min-height:200px;background:var(--panel);border:2px solid var(--c,#fbbf24);border-radius:18px;padding:26px 20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer;width:100%}
.fcard.back{background:#1f2a43;font-size:19px}
.fcard small{display:block;color:var(--mute);font-size:13px;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:#fbbf24;color:#0b1020;border-color:#fbbf24;font-weight:700}
.score{font-size:46px;font-weight:800}
.secres{display:grid;gap:10px;margin:14px 0}
.secres>div{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px}
.miss{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
@media (max-width:640px){.howto,.seccards,.wide{grid-template-columns:1fr}.hero h1{font-size:24px}main{padding:14px 12px 60px}.fcard{font-size:19px}}
</style>
</head>

-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">6<\/text><text x=\"168.4\" y=\"190\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">5<\/text><\/svg><\/div>\n<table class=\"tbl\"><tr><th>Name<\/th><th>Where the angles are<\/th><th>Pairs in the picture<\/th><\/tr>\n<tr><td><b>Exterior angles<\/b><\/td><td>outside the two lines<\/td><td>∠1, ∠2, ∠5, ∠6<\/td><\/tr>\n<tr><td><b>Interior angles<\/b><\/td><td>between the two lines<\/td><td>∠8, ∠3, ∠7, ∠4<\/td><\/tr>\n<tr><td><b>Corresponding<\/b><\/td><td>one interior, one exterior, <b>same side<\/b> of the transversal<\/td><td>∠1 &amp; ∠7, ∠8 &amp; ∠6, ∠2 &amp; ∠4, ∠3 &amp; ∠5<\/td><\/tr>\n<tr><td><b>Alternate interior<\/b><\/td><td>both interior, <b>opposite sides<\/b> of the transversal<\/td><td>∠8 &amp; ∠4, ∠3 &amp; ∠7<\/td><\/tr>\n<tr><td><b>Alternate exterior<\/b><\/td><td>both exterior, <b>opposite sides<\/b> of the transversal<\/td><td>∠1 &amp; ∠5, ∠2 &amp; ∠6<\/td><\/tr>\n<tr><td><b>Consecutive interior<\/b> (same-side interior)<\/td><td>both interior, <b>same side<\/b> of the transversal<\/td><td>∠8 &amp; ∠7, ∠3 &amp; ∠4<\/td><\/tr><\/table>","check":{"t":"mc","q":"In the picture, ∠8 and ∠4 are both between the lines and on opposite sides of the transversal. They are...","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":1,"steps":"Both interior + <b>opposite<\/b> sides = <b>alternate interior<\/b> angles."}},{"h":"A quick way to name any angle pair","body":"<p>Ask two questions about the pair, and the name falls out.<\/p>\n<table class=\"tbl\"><tr><th>1. Where are they?<\/th><th>2. Which side of the transversal?<\/th><th>Name<\/th><\/tr>\n<tr><td>both <b>exterior<\/b><\/td><td>opposite sides<\/td><td>alternate exterior<\/td><\/tr>\n<tr><td>both <b>interior<\/b><\/td><td>opposite sides<\/td><td>alternate interior<\/td><\/tr>\n<tr><td>both <b>interior<\/b><\/td><td>same side<\/td><td>consecutive interior<\/td><\/tr>\n<tr><td>one <b>interior<\/b>, one <b>exterior<\/b><\/td><td>same side<\/td><td>corresponding<\/td><\/tr><\/table>\n<p>Two other pairs can hide in the picture, and neither one has to do with parallel lines:<\/p>\n<ul><li><b>Vertical angles<\/b>: opposite each other where two lines cross (∠1 and ∠3 in the picture).<\/li>\n<li><b>Linear pair<\/b>: side by side on a straight line, adding to 180° (∠1 and ∠2).<\/li><\/ul>\n<div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcwAAAE5CAMAAAAqWuAeAAABgFBMVEX//////v/+/v7+/f79/f3+/P38/Pz8+/z7+/v6+/r6+vr7+fr5+fn4+Pj59/j39/f39vf29vb39fb19fX19PT09PT08/Tz8/Py8/P08vPy8vLz8fLx8fHw8PDv7+/u7u7t7e3s7Ozr6+vq6uro6Ojn5+fm5ubk5OTj4+Ph4eHf39/e3t7d3d3b29vY2NjX19fV1dXU1NTS0tLQ0NDNzc3Ly8vIyMjGxsbExMTCwsK/v7+9vb28vLy9u7y7u7u6urq4uLi4uLe3t7e4tre2tra1tbWysrKwr7Csq6uop6ikpKShoaGenp6bm5uZmZmWlpaUlJSSkpKPj4+NjY2LioqIiIiGhoaEhISCgoKAgIB+fn59fX18fHx6enp4eHh3d3d1dHRzc3NwcHBubm5tbW1qamppaWlnZ2dmZmZlZGRlY2RjY2NkYmNhYWFiYGFgYGBfYF9fX19eXl5dXV1bWltYWFhVVVVSUlJISEg8PDw8Ojs6Ojo3Nzc1MzQzMzMxMDA73ajEAABCSElEQVR42u29iV8iSbo2micnOiZufpmTh5OXwz0MO4qILCKLgF7xemVHQEBEFFkElM/meJXV6aquf/1GRIJWr2d6qmbKROJXdmNpQUY++e7P+wbDrNZqrdZqrdZqrdZqvYHF0j+Ll+99ARYAlgFAoVhCloGQIMoCHrAQvO8nGyKIbwRUMpiIBZwoQB6yCL5zMCGRTaBUHYUvHCEW6m1WgXv3YGL9xBBFy7KKvXwsmZw9uGPEKuadq1libLBwKlbPAvosCjvp+JbArsAECEFO4JQLJsNAdahSDGjwc/nOwSRaCunXNMpUs1gW8YVzplineWxFyrUWX2thp0Ht8m2KCgZTtKfu71KbIsR65r2DCSyhZNA0V1HKeraJwYes5Mo+jXJu6d17QDgswQ92NWkX4KsRUpLF5xGr9Rens6pfjWOU9x2b4EfbECjdZF2KBBMHVQAypv3a7LkVMbx7MPHNsCXaD7ltRYKJTSYLWFuy8/zpPmETAHj3+TzP6WSiUDCx+4pt/mZ2+MOnccalhe8dTNG635xNcx5FgomtBAK8tzT7+Gla8Js58L5DE6D35oY/zBQKJotwcKkL1Z8/fZpd7NnQO88ZgI3jxuzDLK9QyeQQizaO67MPH2e91NY7B5OVvLnxDx9nBYWCiSAjueNnj88//DDJufl35c2yi4QXy8pfwBSpP3/8MDvzqTn6Y6WByUH19lG6Ov3w/Jjzijz3zsCki1Yb8P95V6r//OHDrBrUCywWS6U5EJCDgiMQzIw+zs6jDh68tzgTB2OkIk3ABEAXKtzN/vZhVgkZRCWCiSNNaNiwJ54+DNMODXp3zqwMJi1JA94Sybcms9nDaciIwWQVl5tlIYSCpIs+fhwcatD7YhrINpOkTQiYDCuYvbHS/fShnAwSMBXnAAECJoTqIwKmFs s (classify)"},{"t":"mc","q":"<b>Notes (classify).<\/b> How would you classify ∠6 and ∠8?","opts":["vertical angles","linear pair","alternate exterior angles","consecutive interior angles"],"ans":0,"steps":"They are opposite each other where two lines cross: <b>vertical angles<\/b>.","img":"n_ang","num":"Notes (classify)"},{"t":"text","q":"<b>Notes (postulates).<\/b> Name a pair of parallel lines in the diagram (use the arrows).","accept":["AB∥CD","CD∥AB","ab||cd","cd||ab","AB||CD","CD||AB"],"steps":"The matching arrows on AB and CD show they are parallel. Type it as AB ∥ CD (or AB || CD).","show":"AB ∥ CD","img":"n_abcd","num":"Notes (postulates)"},{"t":"text","q":"<b>Notes (postulates).<\/b> Name a pair of perpendicular lines in the diagram.","accept":["AB⊥AC","AC⊥AB","ab_|_ac","AB_|_AC","AC_|_AB"],"steps":"The right-angle mark at A shows AB ⊥ AC. Type it as AB ⊥ AC (the ⊥ symbol, or _|_).","show":"AB ⊥ AC","img":"n_abcd","num":"Notes (postulates)"},{"t":"tf","q":"<b>Notes (postulates).<\/b> In the diagram, AB ⊥ BC.","opts":["True","False"],"ans":1,"steps":"There is no right-angle mark at B. You cannot assume perpendicular from the look of the drawing.","img":"n_abcd","num":"Notes (postulates)"}]},{"title":"Homework 3.1 (Practice B)","note":"Problems 1 to 24 from the homework. Constructions (29, 30), sketches (25 to 28) and the fire escape (31 to 34) are not here, because they have no key or need paper. Three key errors are corrected below.","probs":[{"t":"mc","q":"<b>HW 1.<\/b> WZ and ZR are ______.","opts":["Parallel (coplanar, never meet)","Skew (not coplanar, never meet)","Perpendicular (meet at 90°)"],"ans":2,"steps":"WZ runs along the top front edge and ZR runs down the right front edge. They meet at Z in a right angle: <b>perpendicular<\/b>.","img":"h_a","num":"HW 1"},{"t":"mc","q":"<b>HW 2.<\/b> WZ and ST are ______.","opts":["Parallel (coplanar, never meet)","Skew (not coplanar, never meet)","Perpendicular (meet at 90°)"],"ans":0,"steps":"WZ (top front) and ST (bottom back) both run left to right, in the same plane (the back-to-front slice of the box): <b>parallel<\/b>.","img":"h_a","num":"HW 2"},{"t":"mc","q":"<b>HW 3.<\/b> QT and YS are ______. (the answer key says parallel; read the note)","opts":["Parallel (coplanar, never meet)","Skew (not coplanar, never meet)","Perpendicular (meet at 90°)"],"ans":1,"steps":"QT runs front to back along the bottom left, and YS runs straight down the back right. They never meet and are not in one plane: <b>skew<\/b>.<br><span class='small'><b>Key error:<\/b> the teacher's key says parallel. QT and YS point in different directions, so they cannot be parallel.<\/span>","img":"h_a","num":"HW 3"},{"t":"mc","q":"<b>HW 4.<\/b> Plane WZR and plane SYZ are ______.","opts":["parallel","perpendicular","skew","the same plane"],"ans":1,"steps":"Plane WZR is the front face and plane SYZ is the right face. They meet at an edge in a right angle: <b>perpendicular<\/b>.","img":"h_a","num":"HW 4"},{"t":"mc","q":"<b>HW 5.<\/b> Plane RQT and plane YXW are ______.","opts":["parallel","perpendicular","skew","intersecting"],"ans":0,"steps":"Plane RQT is the bottom and plane YXW is the top: they never meet, so they are <b>parallel<\/b>.","img":"h_a","num":"HW 5"},{"t":"text","q":"<b>HW 6.<\/b> Name a line parallel to EH. (type one: AB, FG or CD all work)","accept":["AB","FG","CD","BA","GF","DC"],"steps":"EH runs front to back along the bottom left. The edges AB, FG and CD run the same way, so each is parallel to EH.","show":"AB (or FG, CD)","img":"h_b","num":"HW 6"},{"t":"text","q":"<b>HW 7.<\/b> Name a line perpendicular to EH. (type one: FE, AE, HG or HB)","accept":["FE","AE","HG","HB","EF","EA","GH","BH"],"steps":"EH meets FE and AE at E and HG and HB at H, each in a right angle.","show":"FE (or AE, HG, HB)","img":"h_b","num":"HW 7"},{"t":"text","q":"<b>HW 8.<\/b> Name a line skew to CD that contains point F.","accept":["FE","EF"],"steps":"FG is parallel to CD and FD meets CD at D, so neither is skew. FE runs straight down, never meets CD, and points a different way: <b>FE<\/b>.","show":"FE","img":"h_b","num":"HW 8"},{"t":"mc","q":"<b>HW 9.<\/b> Which plane is perpendicular to plane AEH? (the key's answer is wrong; read the note)","opts":["plane CDF","plane EFG","plane FGC","plane ABE"],"ans":1,"steps":"Plane AEH is the bottom. Any <b>side<\/b> face is perpendicular to it, for example plane EFG.<br><span class='small'><b>Key error:<\/b> the key says plane CDF, but CDF is the top face, which is <i>parallel<\/i> to AEH, not perpendicular.<\/span>","img":"h_b","num":"HW 9"},{"t":"text","q":"<b>HW 10.<\/b> Name a plane parallel to plane FGC. (the bottom face)","accept":["planeABE","ABE","planeAEH","AEH","planeEAB","planeHBA","ABH","planeABH"],"steps":"Plane FGC is the top. The bottom face (plane ABE, or AEH, ABH) is parallel to it.","show":"plane ABE","img":"h_b","num":"HW 10"},{"t":"mc","q":"<b>HW 11.<\/b> Classify ∠1 and ∠9.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":0,"steps":"Both are in the upper left of their crossings on the left transversal: corresponding.","img":"h_ang","num":"HW 11"},{"t":"mc","q":"<b>HW 12.<\/b> Classify ∠8 and ∠13.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":3,"steps":"Both between the two lines, same side of the right transversal: consecutive interior.","img":"h_ang","num":"HW 12"},{"t":"mc","q":"<b>HW 13.<\/b> Classify ∠6 and ∠16.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":2,"steps":"Both outside the lines, opposite sides of the right transversal: alternate exterior.","img":"h_ang","num":"HW 13"},{"t":"mc","q":"<b>HW 14.<\/b> Classify ∠4 and ∠10.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":1,"steps":"Both between the lines, opposite sides of the left transversal: alternate interior.","img":"h_ang","num":"HW 14"},{"t":"mc","q":"<b>HW 15.<\/b> Classify ∠8 and ∠16.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":0,"steps":"Both in the lower left of their crossings: corresponding.","img":"h_ang","num":"HW 15"},{"t":"mc","q":"<b>HW 16.<\/b> Classify ∠10 and ∠13.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":3,"steps":"Both between the two lines and on the same side of the bottom line: consecutive interior.","img":"h_ang","num":"HW 16"},{"t":"text","q":"<b>HW 17.<\/b> Name a pair of parallel lines. (use the arrow marks)","accept":["PM∥SQ","SQ∥PM","PM||SQ","SQ||PM","pm||qs","qs||pm","PM∥QS","QS∥PM","PM||QS","QS||PM"],"steps":"The arrow marks on PM and SQ match, so PM ∥ SQ.","show":"PM ∥ SQ","img":"h_mark","num":"HW 17"},{"t":"text","q":"<b>HW 18.<\/b> Name a pair of perpendicular lines.","accept":["TR⊥VN","VN⊥TR","TR_|_VN","VN_|_TR","TR⊥NV","NV⊥TR","TR_|_NV","NV_|_TR"],"steps":"The right-angle mark at R shows TR ⊥ VN.","show":"TR ⊥ VN","img":"h_mark","num":"HW 18"},{"t":"mc","q":"<b>HW 19.<\/b> Is OL ∥ TR? Explain.","opts":["No. They intersect, so they cannot be parallel.","Yes, because both lines slant the same way.","Yes, because there are arrow marks on them.","No, because skew lines are never parallel."],"ans":0,"steps":"OL crosses TR at point T. Parallel lines never intersect, so they are not parallel.","img":"h_mark","num":"HW 19"},{"t":"mc","q":"<b>HW 20.<\/b> Is OL ⊥ TR? Explain.","opts":["No. There is no right-angle mark on it.","Yes, because the two lines cross each other.","Yes, because TR is horizontal and OL is not.","No, because OL is skew to the line TR."],"ans":0,"steps":"Crossing is not enough. Perpendicular must be stated or marked with a right-angle symbol.","img":"h_mark","num":"HW 20"},{"t":"mc","q":"<b>HW 21.<\/b> If two lines are parallel, then they ______ intersect.","opts":["always","sometimes","never"],"ans":2,"steps":"Parallel lines never meet.","num":"HW 21"},{"t":"mc","q":"<b>HW 22.<\/b> If one line is skew to another, then they are ______ coplanar.","opts":["always","sometimes","never"],"ans":2,"steps":"Skew lines are non-coplanar by definition.","num":"HW 22"},{"t":"mc","q":"<b>HW 23.<\/b> If two lines intersect, then they are ______ perpendicular.","opts":["always","sometimes","never"],"ans":1,"steps":"Crossing lines are perpendicular only when they make 90° angles.","num":"HW 23"},{"t":"mc","q":"<b>HW 24.<\/b> If two lines are coplanar, then they are ______ parallel.","opts":["always","sometimes","never"],"ans":1,"steps":"Coplanar lines can be parallel, or they can intersect.","num":"HW 24"}]}],"new":false},{"id":"3.2","title":"Use Parallel Lines and Transversals","blurb":"Corresponding, alternate and consecutive angle rules, solving for x, and two-column proofs.","topics":[{"h":"The parallel line rules: one postulate, three theorems","body":"<p>When two lines are <b>parallel<\/b> and a transversal cuts them, the angle pairs from 3.1 suddenly follow rules. <b>These only work if the lines are parallel.<\/b><\/p>\n<div class=\"fig\"><svg viewBox=\"0 0 380 235\" width=\"380\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;font-family:Georgia,serif\"><line x1=\"22\" y1=\"82\" x2=\"358\" y2=\"82\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,82 28,77 28,87\" fill=\"#1f2937\"/><polygon points=\"364,82 352,77 352,87\" fill=\"#1f2937\"/><polygon points=\"310,82 296,76 296,88\" fill=\"#dc2626\"/><text x=\"370\" y=\"72\" font-size=\"15\" fill=\"#1f2937\" text-anchor=\"end\" font-style=\"italic\">g<\/text><line x1=\"22\" y1=\"168\" x2=\"358\" y2=\"168\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,168 28,163 28,173\" fill=\"#1f2937\"/><polygon points=\"364,168 352,163 352,173\" fill=\"#1f2937\"/><polygon points=\"310,168 296,162 296,174\" fill=\"#dc2626\"/><text x=\"370\" y=\"158\" font-size=\"15\" fill=\"#1f2937\" text-anchor=\"end\" font-style=\"italic\">h<\/text><line x1=\"246.0\" y1=\"24\" x2=\"140.7\" y2=\"221\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"246.0,20 241.0,33 252.0,33\" fill=\"#1f2937\" transform=\"rotate(0)\"/><polygon points=\"140.7,225 134.7,212 145.7,212\" fill=\"#1f2937\"/><text x=\"258.0232558139535\" y=\"28\" font-size=\"15\" fill=\"#1f2937\" text-anchor=\"start\" font-style=\"italic\">t<\/text><text x=\"215.6\" y=\"73\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">1<\/text><text x=\"233.6\" y=\"73\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">2<\/text><text x=\"196.4\" y=\"104\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">8<\/text><text x=\"214.4\" y=\"104\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">3<\/text><text x=\"169.6\" y=\"159\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">7<\/text><text x=\"187.6\" y=\"159\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">4<\/text><text x=\"150.4\" y=\"190\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">6<\/text><text x=\"168.4\" y=\"190\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">5<\/text><\/svg><\/div>\n<table class=\"tbl\"><tr><th>Rule<\/th><th>If two parallel lines are cut by a transversal, then...<\/th><th>Example in the picture<\/th><\/tr>\n<tr><td><b>Postulate 15<\/b><br>Corresponding Angles<\/td><td>corresponding angles are <b>congruent<\/b><\/td><td>∠1 ≅ ∠7<\/td><\/tr>\n<tr><td><b>Theorem 3.1<\/b><br>Alternate Interior Angles<\/td><td>alternate interior angles are <b>congruent<\/b><\/td><td>∠8 ≅ ∠4<\/td><\/tr>\n<tr><td><b>Theorem 3.2<\/b><br>Alternate Exterior Angles<\/td><td>alternate exterior angles are <b>congruent<\/b><\/td><td>∠1 ≅ ∠5<\/td><\/tr>\n<tr><td><b>Theorem 3.3<\/b><br>Consecutive Interior Angles<\/td><td>consecutive interior angles are <b>supplementary<\/b><\/td><td>∠3 and ∠4 add to 180°<\/td><\/tr><\/table>\n<p>Also true (your notes): if the lines are parallel, <b>consecutive exterior<\/b> angles are supplementary.<\/p>\n<div class=\"tip\"><b>Memory trick:<\/b> <i>corresponding, alternate interior, alternate exterior<\/i> are all <b>equal<\/b>. Only <i>consecutive<\/i> (same-side) angles are <b>supplementary<\/b>. A postulate is accepted; the three theorems are proven from it.<\/div>","check":{"t":"mc","q":"Two parallel lines are cut by a transversal. Which pair of angles must add to 180°?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":3,"steps":"Only <b>consecutive (same-side) interior<\/b> angles are supplementary. The other three types are congruent."}},{"h":"Find every angle from one angle","body":"<p><b>Example 1.<\/b> In the figure, m∠3 = 110° and m∠12 = 55°. Find the measure of each angle and give the reason.<\/p>\n<div class=\"fig\"><svg viewBox=\"0 0 420 250\" width=\"420\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;font-family:Georgia,serif\"><line x1=\"20\" y1=\"80\" x2=\"400\" y2=\"80\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"14,80 26,75 26,85\" fill=\"#1f2937\"/><polygon points=\"406,80 394,75 394,85\" fill=\"#1f2937\"/><text x=\"412\" y=\"71\" font-size=\"15\" fill=\"#1f2937\" text-anchor=\"end\" font-style=\"italic\">p<\/text><line x1=\"20\" y1=\"175\" x2=\"400\" y2=\"175\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"14,175 26,170 26,180\" fill=\"#1f2937\"/><polygon points=\"406,175 394,170 394,180\" fill=\"#1f2937\"/><text x=\"412\" y=\"166\" font-size=\"15\" fill=\"#1f2937\" text-anchor=\"end\" font-style=\"italic\">q<\/text><line x1=\"175.3\" y1=\"20\" x2=\"83.5\" y2=\"238\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"175.3,16 170.3,29 181.3,29\" fill=\"#1f2937\"/><polygon points=\"83.5,242 77.5,229 88.5,229\" fill=\"#1f2937\"/><line x1=\"345.3\" y1=\"20\" x2=\"253.5\" y2=\"238\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"345.3,16 340.3,29 351.3,29\" fill=\"#1f2937\"/><polygon points=\"253.5,242 247.5,229 258.5,229\" fill=\"#1f2937\"/><text x=\"149.6\" y=\"72\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">1<\/text><text x=\"165.6\" y=\"72\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">2<\/text><text x=\"134.4\" y=\"101\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">5<\/text><text x=\"150.4\" y=\"101\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">6<\/text><text x=\"319.6\" y=\"72\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">3<\/text><text x=\"335.6\" y=\"72\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">4<\/text><text x=\"304.4\" y=\"101\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">7<\/text><text x=\"320.4\" y=\"101\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">8<\/text><text x=\"109.6\" y=\"167\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">9<\/text><text x=\"125.6\" y=\"167\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">10<\/text><text x=\"94.4\" y=\"196\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">13<\/text><text x=\"110.4\" y=\"196\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">14<\/text><text x=\"279.6\" y=\"167\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">11<\/text><text x=\"295.6\" y=\"167\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">12<\/text><text x=\"264.4\" y=\"196\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">15<\/text><text x=\"280.4\" y=\"196\" font-size=\"14\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">16<\/text><\/svg><\/div>\n<table class=\"tbl\"><tr><th>Angle<\/th><th>Measure<\/th><th>Reason<\/th><\/tr>\n<tr><td>∠1<\/td><td>110°<\/td><td>Corresponding Angles Postulate (same spot as ∠3)<\/td><\/tr>\n<tr><td>∠6<\/td><td>110°<\/td><td>Vertical angles (opposite ∠1)<\/td><\/tr>\n<tr><td>∠2<\/td><td>70°<\/td><td>Linear Pair Postulate (180° − 110°)<\/td><\/tr>\n<tr><td>∠10<\/td><td>55°<\/td><td>Corresponding Angles Postulate (same spot as ∠12)<\/td><\/tr>\n<tr><td>∠13<\/td><td>55°<\/td><td>Vertical angles (opposite ∠10)<\/td><\/tr>\n<tr><td>∠15<\/td><td>55°<\/td><td>Vertical angles (opposite ∠12)<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Steps:<\/b> 1) find the angle's partner (same spot, or opposite, or side by side); 2) name the relationship; 3) equal, or subtract from 180°.<\/div>","check":{"t":"mc","q":"In Example 1, m∠3 = 110° and ∠3 and ∠4 are side by side on a straight line. What is m∠4?","opts":["70°","110°","90°","55°"],"ans":0,"steps":"A linear pair adds to 180°: 180° − 110° = <b>70°<\/b>."}},{"h":"Solving for x: equal or add to 180?","body":"<p>When the angles are written with x, decide first whether they are <b>equal<\/b> or <b>supplementary<\/b>, then write the equation.<\/p>\n<table class=\"tbl\"><tr><th>The angles are...<\/th><th>Equation<\/th><\/tr>\n<tr><td>corresponding, alternate interior, alternate exterior, vertical<\/td><td>left side <b>=<\/b> right side<\/td><\/tr>\n<tr><td>consecutive interior, linear pair<\/td><td>left side <b>+<\/b> right side <b>= 180<\/b><\/td><\/tr><\/table>\n<p><b>Class example:<\/b> two consecutive interior angles are 3x° and 6x°.<\/p>\n<ol><li>Consecutive interior with parallel lines: supplementary.<\/li><li>3x + 6x = 180<\/li><li>9x = 180, so x = 20<\/li><li>Check: the angles are 60° and 120°, and 60 + 120 = 180.<\/li><\/ol>\n<p><b>Class example:<\/b> parallel lines, angles (3x − 4)° and 113° are alternate exterior.<\/p>\n<div class=\"fig\"><svg viewBox=\"0 0 380 235\" width=\"380\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;font-family:Georgia,serif\"><line x1=\"22\" y1=\"82\" x2=\"358\" y2=\"82\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,82 28,77 28,87\" fill=\"#1f2937\"/><polygon points=\"364,82 352,77 352,87\" fill=\"#1f2937\"/><polygon points=\"310,82 296,76 296,88\" fill=\"#dc2626\"/><line x1=\"22\" y1=\"168\" x2=\"358\" y2=\"168\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,168 28,163 28,173\" fill=\"#1f2937\"/><polygon points=\"364,168 352,163 352,173\" fill=\"#1f2937\"/><polygon points=\"310,168 296,162 296,174\" fill=\"#dc2626\"/><line x1=\"184.0\" y1=\"24\" x2=\"289.3\" y2=\"221\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"184.0,20 179.0,33 190.0,33\" fill=\"#1f2937\" transform=\"rotate(0)\"/><polygon points=\"289.3,225 283.3,212 294.3,212\" fill=\"#1f2937\"/><text x=\"196.4\" y=\"73\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">113°<\/text><text x=\"279.6\" y=\"190\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">(3x − 4)°<\/text><\/svg><\/div>\n<ol><li>Alternate exterior: congruent, so 3x − 4 = 113.<\/li><li>3x = 117, so x = 39.<\/li><\/ol>\n<p><b>Class example:<\/b> parallel lines, (3x − 7)° and (x + 5)° are equal.<\/p>\n<div class=\"fig\"><svg viewBox=\"0 0 380 235\" width=\"380\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;font-family:Georgia,serif\"><line x1=\"22\" y1=\"82\" x2=\"358\" y2=\"82\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,82 28,77 28,87\" fill=\"#1f2937\"/><polygon points=\"364,82 352,77 352,87\" fill=\"#1f2937\"/><polygon points=\"310,82 296,76 296,88\" fill=\"#dc2626\"/><line x1=\"22\" y1=\"168\" x2=\"358\" y2=\"168\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,168 28,163 28,173\" fill=\"#1f2937\"/><polygon points=\"364,168 352,163 352,173\" fill=\"#1f2937\"/><polygon points=\"310,168 296,162 296,174\" fill=\"#dc2626\"/><line x1=\"246.0\" y1=\"24\" x2=\"140.7\" y2=\"221\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"246.0,20 241.0,33 252.0,33\" fill=\"#1f2937\" transform=\"rotate(0)\"/><polygon points=\"140.7,225 134.7,212 145.7,212\" fill=\"#1f2937\"/><text x=\"215.6\" y=\"73\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">(3x − 7)°<\/text><text x=\"169.6\" y=\"159\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">(x + 5)°<\/text><\/svg><\/div>\n<ol><li>3x − 7 = x + 5<\/li><li>2x = 12, so x = 6.<\/li><\/ol>","check":{"t":"mc","q":"Parallel lines are cut by a transversal. Consecutive interior angles measure (2x + 10)° and (3x + 20)°. Which equation do you solve?","opts":["(2x + 10) + (3x + 20) = 180","2x + 10 = 3x + 20","(2x + 10) + (3x + 20) = 90","2x + 10 = 180 − 3x + 20"],"ans":0,"steps":"Consecutive interior angles are supplementary, so they add to 180. Here x = 30."}},{"h":"Two variables in one figure","body":"<p><b>Class Example 3.<\/b> Find x and y in the figure (parallel lines).<\/p>\n<div class=\"fig\"><svg viewBox=\"0 0 400 235\" width=\"400\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;font-family:Georgia,serif\"><line x1=\"22\" y1=\"82\" x2=\"378\" y2=\"82\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,82 28,77 28,87\" fill=\"#1f2937\"/><polygon points=\"384,82 372,77 372,87\" fill=\"#1f2937\"/><polygon points=\"330,82 316,76 316,88\" fill=\"#dc2626\"/><line x1=\"22\" y1=\"168\" x2=\"378\" y2=\"168\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"16,168 28,163 28,173\" fill=\"#1f2937\"/><polygon points=\"384,168 372,163 372,173\" fill=\"#1f2937\"/><polygon points=\"330,168 316,162 316,174\" fill=\"#dc2626\"/><line x1=\"246.0\" y1=\"24\" x2=\"140.7\" y2=\"221\" stroke=\"#1f2937\" stroke-width=\"2\"/><polygon points=\"246.0,20 241.0,33 252.0,33\" fill=\"#1f2937\" transform=\"rotate(0)\"/><polygon points=\"140.7,225 134.7,212 145.7,212\" fill=\"#1f2937\"/><text x=\"196.4\" y=\"104\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"end\" font-style=\"normal\">10x°<\/text><text x=\"214.4\" y=\"104\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">(8y + 2)°<\/text><text x=\"187.6\" y=\"159\" font-size=\"15\" fill=\"#2563eb\" text-anchor=\"start\" font-style=\"normal\">(25y − 20)°<\/text><\/svg><\/div>\n<p>Look at which angles pair up:<\/p>\n<ul><li>(8y + 2)° and (25y − 20)° are <b>consecutive interior<\/b>: supplementary.<\/li>\n<li>10x° and (8y + 2)° are a <b>linear pair<\/b>: supplementary.<\/li><\/ul>\n<ol><li>(8y + 2) + (25y − 20) = 180, so 33y − 18 = 180 and 33y = 198, so <b>y = 6<\/b>.<\/li>\n<li>8(6) + 2 = 50, so the angle is 50°.<\/li>\n<li>10x + 50 = 180, so 10x = 130 and <b>x = 13<\/b>.<\/li><\/ol>\n<div class=\"tip\"><b>Always solve the variable you can get from one equation first.<\/b> Here y only appears in the consecutive interior pair, so start there, then use the answer in the second equation.<\/div>","check":{"t":"text","q":"Using the same figure, what is the value of y? (number only)","accept":["6","y=6"],"steps":"(8y + 2) + (25y − 20) = 180, so 33y = 198 and y = 6.","show":"6"}},{"h":"Two-column proofs with parallel lines","body":"<p>The proofs in 3.2 use the same toolbox as Unit 2, plus the new parallel line rules. Most follow one of two patterns.<\/p>\n<p><b>Pattern 1: \"prove two angles are congruent\"<\/b>. Find a middle angle and use two congruent pairs, then <b>Transitive Property of Congruence<\/b>.<\/p>\n<div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcwAAADaCAMAAAAc/YKGAAABgFBMVEX///////7///3+/v/+/v7+/v3+/vz9/f39/fz9/fv8/Pz8/Pv8/Pr7+/v7+/r7+/n6+vr6+vn6+vj5+fn5+fj5+ff4+Pj4+Pf39/f39/b29vX19fX19fT09PPz8/Ly8vLy8fHx8fDw8PDv7+/v7+7u7u3t7ezs7 +h/1NTS0lrvp5HpfUwBU9mnwXzD7uNpU5r1PqaArotbvg8cuRM0Z3ofk7Om/QmdN2IqhOmMt9S4xrvdlcIU0JOAEFmqgCmgcr+bLkgrgYlGbXJJkJwKmBgMp94zi5KsCpj2D6+zNSatZNVIs5DqA8qySmAKGF6AEnJTAZPDyEHUpAlTBUwOHee9lGSVwMRgJLMIxaSmAqaAsVRpgJKsCpgcYslqP1mqgMlZ+f5rmjCVwEQBC/vVjAamEpgwdthCFzGVwOTGi4NmslQC00mySwO6fl+Japhh6NlgQfKSHxOdqiR6MkIrWQUwTeDQtDvhp5Ws/JhWZbP/l4MloCQrPyaHnhRMHdQirWRVwBxIPtmKUVWiAqaAl5uJvuZBTvf9qIA5eJ5d250WhCk/pg2TF3vj9UBWCmCiGRt/AlRjKlJnOv+9oOWPK5ihq/gnizxu02x5tyQWuiU+mdJb5f24PcG+dWL2bZtJk5bHQ5h9DlTegE4nOjob6x7/j8LT8biu1YHKG/DzVdT+9utvFJ6OX3+r/vmWgOt/SeH9uNUb6D1SJwiTMCkIk4IwKQhTu/g/oTQSOeMOeZMAAAAASUVORK5CYII=\" alt=\"Lines m and n cut by transversal s, angles 1, 2, 3\"><\/div>\n<table class=\"tbl\"><tr><th>Statement<\/th><th>Reason<\/th><\/tr>\n<tr><td>1. m ∥ n<\/td><td>Given<\/td><\/tr>\n<tr><td>2. ∠1 ≅ ∠3<\/td><td>Corresponding Angles Postulate<\/td><\/tr>\n<tr><td>3. ∠2 ≅ ∠3<\/td><td>Vertical Angles Congruence Theorem<\/td><\/tr>\n<tr><td>4. ∠1 ≅ ∠2<\/td><td>Transitive Property of Congruence<\/td><\/tr><\/table>\n<p><b>Pattern 2: \"prove two angles are supplementary\"<\/b>. Get an equation m∠A + m∠B = 180 from a linear pair or consecutive interior angles, swap in an equal angle with <b>Substitution<\/b>, then finish with <b>Definition of supplementary angles<\/b> (see the Quiz Review proofs).<\/p>\n<div class=\"tip\"><b>Which reason?<\/b> Look at the two angles in the statement. Name the pair (from 3.1), then use the rule for that pair: corresponding → <i>Corresponding Angles Postulate<\/i>; alternate interior → <i>Alternate Interior Angles Theorem<\/i>; alternate exterior → <i>Alternate Exterior Angles Theorem<\/i>; consecutive interior → <i>Consecutive Interior Angles Theorem<\/i>; side by side → <i>Linear Pair Postulate<\/i>; opposite → <i>Vertical Angles Congruence Theorem<\/i>.<\/div>","check":{"t":"mc","q":"In a proof, you write \"∠2 ≅ ∠6\" for two angles that are outside the parallel lines on opposite sides of the transversal. What is the reason?","opts":["Alternate Exterior Angles Theorem","Alternate Interior Angles Theorem","Corresponding Angles Postulate","Vertical Angles Congruence Theorem"],"ans":0,"steps":"Both exterior, opposite sides: <b>Alternate Exterior Angles Theorem<\/b>."}}],"sets":[{"title":"Class notes: Examples","note":"The 3.2 notes examples with the key's answers.","probs":[{"t":"mc","q":"<b>Notes (Postulate 15).<\/b> If two parallel lines are cut by a transversal, then each pair of corresponding angles is...","opts":["congruent","supplementary","complementary","perpendicular"],"ans":0,"steps":"<b>Corresponding Angles Postulate:<\/b> corresponding angles are congruent.","num":"Notes"},{"t":"mc","q":"<b>Notes (Theorem 3.1).<\/b> If two parallel lines are cut by a transversal, then alternate interior angles are...","opts":["congruent","supplementary","complementary","adjacent"],"ans":0,"steps":"<b>Alternate Interior Angles Theorem:<\/b> congruent.","num":"Notes"},{"t":"mc","q":"<b>Notes (Theorem 3.2).<\/b> If two parallel lines are cut by a transversal, then alternate exterior angles are...","opts":["congruent","supplementary","complementary","right angles"],"ans":0,"steps":"<b>Alternate Exterior Angles Theorem:<\/b> congruent.","num":"Notes"},{"t":"mc","q":"<b>Notes (Theorem 3.3).<\/b> If two parallel lines are cut by a transversal, then consecutive interior angles are...","opts":["supplementary","congruent","complementary","vertical"],"ans":0,"steps":"<b>Consecutive Interior Angles Theorem:<\/b> supplementary (add to 180°).","num":"Notes"},{"t":"mc","q":"<b>Notes.<\/b> If two lines are parallel, consecutive exterior angles are...","opts":["supplementary","congruent","complementary","equal to 90°"],"ans":0,"steps":"Same-side exterior angles also add to 180°.","num":"Notes"},{"t":"text","q":"<b>Example 1a.<\/b> m∠3 = 110° and m∠12 = 55°. Find m∠1. (number only)","accept":["110","110°"],"steps":"∠1 corresponds to ∠3 (same spot at the other crossing): Corresponding Angles Postulate, so 110°.","show":"110","svg":"ex1","num":"Example 1a"},{"t":"text","q":"<b>Example 1b.<\/b> m∠3 = 110° and m∠12 = 55°. Find m∠6. (number only)","accept":["110","110°"],"steps":"∠6 is vertical to ∠1 (110°), so 110°.","show":"110","svg":"ex1","num":"Example 1b"},{"t":"text","q":"<b>Example 1c.<\/b> m∠3 = 110° and m∠12 = 55°. Find m∠2. (number only)","accept":["70","70°"],"steps":"∠2 and ∠1 are a linear pair: 180° − 110° = 70°.","show":"70","svg":"ex1","num":"Example 1c"},{"t":"text","q":"<b>Example 1d.<\/b> m∠3 = 110° and m∠12 = 55°. Find m∠10. (number only)","accept":["55","55°"],"steps":"∠10 corresponds to ∠12 (55°): Corresponding Angles Postulate.","show":"55","svg":"ex1","num":"Example 1d"},{"t":"text","q":"<b>Example 1e.<\/b> m∠3 = 110° and m∠12 = 55°. Find m∠13. (number only)","accept":["55","55°"],"steps":"∠13 is vertical to ∠10 (55°).","show":"55","svg":"ex1","num":"Example 1e"},{"t":"text","q":"<b>Example 1f.<\/b> m∠3 = 110° and m∠12 = 55°. Find m∠15. (number only)","accept":["55","55°"],"steps":"∠15 is vertical to ∠12 (55°).","show":"55","svg":"ex1","num":"Example 1f"},{"t":"text","q":"<b>Example 3.<\/b> Find y.","accept":["6","y=6"],"steps":"(8y + 2) + (25y − 20) = 180 (consecutive interior), so 33y = 198, y = 6.","show":"6","svg":"alg_ex3","num":"Example 3"},{"t":"text","q":"<b>Example 3.<\/b> Find x.","accept":["13","x=13"],"steps":"10x + (8·6 + 2) = 180 (linear pair), so 10x + 50 = 180, 10x = 130, x = 13.","show":"13","svg":"alg_ex3","num":"Example 3"},{"t":"text","q":"<b>Find the value of x<\/b> (parallel lines, alternate exterior angles). (3x − 4)° and 113°.","accept":["39","x=39"],"steps":"Alternate exterior angles are congruent: 3x − 4 = 113, 3x = 117, x = 39.","show":"39","svg":"kx1","num":"Class example"},{"t":"text","q":"<b>Find the value of x<\/b> (parallel lines). (3x − 7)° and (x + 5)° are equal.","accept":["6","x=6"],"steps":"3x − 7 = x + 5, so 2x = 12 and x = 6.","show":"6","svg":"kx2","num":"Class example"}]},{"title":"Homework: angle pairs (find x)","note":"Eight problems: name the pair, say congruent or supplementary, find x. Page 7 problems follow.","probs":[{"t":"mc","q":"<b>Sheet 1 #1.<\/b> What type of angle pair are x° and the given angle?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":0,"steps":"Both are in the same spot on their crossings: corresponding, so congruent and x = 68.","img":"hw_a1","num":"Sheet 1 #1"},{"t":"text","q":"<b>Sheet 1 #1.<\/b> Find x. (number only)","accept":["68"],"steps":"Both are in the same spot on their crossings: corresponding, so congruent and x = 68.","show":"68","img":"hw_a1","num":"Sheet 1 #1"},{"t":"mc","q":"<b>Sheet 1 #2.<\/b> What type of angle pair are x° and the given angle?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":3,"steps":"x and 134° are between the lines on the same side of the transversal: consecutive interior, so x = 180 − 134 = 46.","img":"hw_a2","num":"Sheet 1 #2"},{"t":"text","q":"<b>Sheet 1 #2.<\/b> Find x. (number only)","accept":["46"],"steps":"x and 134° are between the lines on the same side of the transversal: consecutive interior, so x = 180 − 134 = 46.","show":"46","img":"hw_a2","num":"Sheet 1 #2"},{"t":"text","q":"<b>Sheet 1 #3.<\/b> Find x. (number only)","accept":["120"],"steps":"x and 120° are vertical angles (opposite each other where the lines cross), so x = 120.","show":"120","img":"hw_a3","num":"Sheet 1 #3"},{"t":"mc","q":"<b>Sheet 1 #4.<\/b> What type of angle pair are x° and the given angle?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":1,"steps":"Both between the lines, opposite sides of the transversal: alternate interior, so x = 101.","img":"hw_a4","num":"Sheet 1 #4"},{"t":"text","q":"<b>Sheet 1 #4.<\/b> Find x. (number only)","accept":["101"],"steps":"Both between the lines, opposite sides of the transversal: alternate interior, so x = 101.","show":"101","img":"hw_a4","num":"Sheet 1 #4"},{"t":"text","q":"<b>Sheet 1 #5.<\/b> Find x. (number only)","accept":["103"],"steps":"x and 77° make a supplementary pair (the key does not name the pair), so x = 180 − 77 = 103.","show":"103","img":"hw_a5","num":"Sheet 1 #5"},{"t":"mc","q":"<b>Sheet 1 #6.<\/b> What type of angle pair are x° and the given angle?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":1,"steps":"Between the lines on opposite sides: alternate interior, so x = 106.","img":"hw_a6","num":"Sheet 1 #6"},{"t":"text","q":"<b>Sheet 1 #6.<\/b> Find x. (number only)","accept":["106"],"steps":"Between the lines on opposite sides: alternate interior, so x = 106.","show":"106","img":"hw_a6","num":"Sheet 1 #6"},{"t":"mc","q":"<b>Sheet 1 #7.<\/b> What type of angle pair are x° and the given angle?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":3,"steps":"Between the lines on the same side: consecutive interior, so x = 180 − 74 = 106.","img":"hw_a7","num":"Sheet 1 #7"},{"t":"text","q":"<b>Sheet 1 #7.<\/b> Find x. (number only)","accept":["106"],"steps":"Between the lines on the same side: consecutive interior, so x = 180 − 74 = 106.","show":"106","img":"hw_a7","num":"Sheet 1 #7"},{"t":"mc","q":"<b>Sheet 1 #8.<\/b> What type of angle pair are x° and the given angle?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":2,"steps":"Outside the lines on opposite sides: alternate exterior, so x = 142.","img":"hw_a8","num":"Sheet 1 #8"},{"t":"text","q":"<b>Sheet 1 #8.<\/b> Find x. (number only)","accept":["142"],"steps":"Outside the lines on opposite sides: alternate exterior, so x = 142.","show":"142","img":"hw_a8","num":"Sheet 1 #8"}]},{"title":"Homework: write the equation and solve","note":"Page 7: for each pair, write the equation, solve, then find both angle measures. The key has two slips, noted below.","probs":[{"t":"text","q":"<b>Sheet 2 #1.<\/b> The consecutive interior angles are 3x° and 6x°. Find x.","accept":["20","x=20"],"steps":"3x + 6x = 180, so 9x = 180 and x = 20.","show":"20","img":"hw_b1","num":"Sheet 2 #1"},{"t":"text","q":"<b>Sheet 2 #1.<\/b> Find the two angle measures. (type them as 60 and 120)","accept":["60and120","120and60","60,120","120,60"],"steps":"3(20) = 60 and 6(20) = 120.<br><span class='small'><b>Key error:<\/b> the key writes \"60°, 180°\". The second angle is 120° (and 60 + 120 = 180).<\/span>","show":"60 and 120","img":"hw_b1","num":"Sheet 2 #1"},{"t":"mc","q":"<b>Sheet 2 #2.<\/b> The angles (7x − 12)° and (3x + 28)° are alternate exterior angles. Which equation do you solve?","opts":["7x − 12 = 3x + 28","(7x − 12) + (3x + 28) = 180","7x − 12 = 180 − (3x + 28)","7x − 12 + 3x = 28"],"ans":0,"steps":"Alternate exterior angles are congruent, so set them equal. 4x = 40, x = 10.","img":"hw_b2","num":"Sheet 2 #2"},{"t":"text","q":"<b>Sheet 2 #2.<\/b> Find x.","accept":["10","x=10"],"steps":"7x − 12 = 3x + 28, so 4x = 40 and x = 10. Each angle is 7(10) − 12 = 58°.","show":"10","img":"hw_b2","num":"Sheet 2 #2"},{"t":"text","q":"<b>Sheet 2 #2.<\/b> Find the measure of each angle. (number only, they are equal)","accept":["58","58°"],"steps":"7(10) − 12 = 58 and 3(10) + 28 = 58.","show":"58","img":"hw_b2","num":"Sheet 2 #2"},{"t":"text","q":"<b>Sheet 2 #3.<\/b> The consecutive interior angles are (3x + 77)° and (4x + 54)°. Find x.","accept":["7","x=7"],"steps":"(3x + 77) + (4x + 54) = 180, so 7x + 131 = 180 and 7x = 49. x = 7.","show":"7","img":"hw_b3","num":"Sheet 2 #3"},{"t":"text","q":"<b>Sheet 2 #3.<\/b> Find the larger angle measure. (number only)","accept":["98","98°"],"steps":"3(7) + 77 = 98 and 4(7) + 54 = 82. The larger angle is 98°.","show":"98","img":"hw_b3","num":"Sheet 2 #3"},{"t":"mc","q":"<b>Sheet 2 #4.<\/b> What type of pair are (9x + 8)° and (4x + 18)°?","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":0,"steps":"They are in matching positions at the two crossings: corresponding, so they are equal.","img":"hw_b4","num":"Sheet 2 #4"},{"t":"text","q":"<b>Sheet 2 #4.<\/b> Find x.","accept":["2","x=2"],"steps":"9x + 8 = 4x + 18, so 5x = 10 and x = 2.<br><span class='small'><b>Key error:<\/b> the key's work gives x = 2, but the \"x =\" line shows 26. 26 is the angle measure, not x.<\/span>","show":"2","img":"hw_b4","num":"Sheet 2 #4"},{"t":"text","q":"<b>Sheet 2 #4.<\/b> Find the measure of each angle. (number only, they are equal)","accept":["26","26°"],"steps":"9(2) + 8 = 26 and 4(2) + 18 = 26.","show":"26","img":"hw_b4","num":"Sheet 2 #4"}]},{"title":"Proof practice (two-column)","note":"The five proofs from the more-proof-practice sheet. Pick each reason from the dropdown.","probs":[{"t":"proof","q":"<b>Proof 1.<\/b> Given: q ∥ r, p ∥ t. Prove: ∠1 ≅ ∠3.","rows":[{"s":"q ∥ r, p ∥ t","r":["Given"],"why":"Given","fixed":true},{"s":"∠1 ≅ ∠2","r":["Corresponding Angles Postulate"],"why":"∠1 and ∠2 are in the same spot (upper right) at the crossings of line q, and p ∥ t.","fixed":false},{"s":"∠2 ≅ ∠3","r":["Alternate Exterior Angles Theorem"],"why":"∠2 and ∠3 are outside the lines on opposite sides of line p, and q ∥ r.","fixed":false},{"s":"∠1 ≅ ∠3","r":["Transitive Property of Congruence"],"why":"∠1 ≅ ∠2 and ∠2 ≅ ∠3.","fixed":false}],"steps":"Find the middle angle ∠2. It connects ∠1 (across p ∥ t) and ∠3 (across q ∥ r).","img":"pp1","num":"Proof 1"},{"t":"proof","q":"<b>Proof 2.<\/b> Given: a ∥ b, c ∥ d. Prove: ∠1 ≅ ∠3.","rows":[{"s":"a ∥ b, c ∥ d","r":["Given"],"why":"Given","fixed":true},{"s":"∠1 ≅ ∠2","r":["Alternate Interior Angles Theorem"],"why":"∠1 and ∠2 are between a and b on opposite sides of c, and a ∥ b.","fixed":false},{"s":"∠2 ≅ ∠3","r":["Corresponding Angles Postulate"],"why":"∠2 and ∠3 are in matching spots at b's crossings with c and d, and c ∥ d.","fixed":false},{"s":"∠1 ≅ ∠3","r":["Transitive Property of Congruence"],"why":"Chain the two congruences.","fixed":false}],"steps":"Use ∠2 as the middle angle.","img":"pp2","num":"Proof 2"},{"t":"proof","q":"<b>Proof 3.<\/b> Given: a ∥ b, c ∥ d. Prove: ∠1 ≅ ∠3.","rows":[{"s":"a ∥ b, c ∥ d","r":["Given"],"why":"Given","fixed":true},{"s":"∠1 ≅ ∠2","r":["Corresponding Angles Postulate"],"why":"∠1 and ∠2 are in matching spots at the crossings of d with a and b, and a ∥ b.","fixed":false},{"s":"∠2 ≅ ∠3","r":["Vertical Angles Congruence Theorem"],"why":"∠2 and ∠3 are opposite each other where b and d cross.","fixed":false},{"s":"∠1 ≅ ∠3","r":["Transitive Property of Congruence"],"why":"Chain the two congruences.","fixed":false}],"steps":"Here the middle angle ∠2 is vertical to ∠3.","img":"pp3","num":"Proof 3"},{"t":"proof","q":"<b>Proof 4.<\/b> Given: a ∥ b, c ∥ d. Prove: ∠1 and ∠3 are supplementary.","rows":[{"s":"a ∥ b, c ∥ d","r":["Given"],"why":"Given","fixed":true},{"s":"∠2 and ∠3 are supplementary","r":["Linear Pair Postulate"],"why":"∠2 and ∠3 are side by side on line d and form a linear pair.","fixed":false},{"s":"m∠2 + m∠3 = 180","r":["Definition of supplementary angles"],"why":"Supplementary angles add to 180°.","fixed":false},{"s":"∠1 ≅ ∠2","r":["Corresponding Angles Postulate"],"why":"∠1 and ∠2 are in matching spots at the crossings of a with c and d, and c ∥ d.","fixed":false},{"s":"m∠1 = m∠2","r":["Definition of congruent angles","Definition of congruence"],"why":"Congruent angles have equal measures.","fixed":false},{"s":"m∠1 + m∠3 = 180","r":["Substitution Property of Equality","Transitive Property of Equality"],"why":"Replace m∠2 with m∠1 in line 3.","fixed":false},{"s":"∠1 and ∠3 are supplementary","r":["Definition of supplementary angles"],"why":"Their measures add to 180°.","fixed":false}],"steps":"Get 180 from the first pair, swap in the equal angle, then finish with the definition.","img":"pp4","num":"Proof 4"},{"t":"proof","q":"<b>Proof 5.<\/b> Given: a ∥ b, c ∥ d. Prove: ∠1 and ∠3 are supplementary. (The blank worksheet says ∠1 ≅ ∠3; the key proves supplementary, so we prove that.)","rows":[{"s":"a ∥ b, c ∥ d","r":["Given"],"why":"Given","fixed":true},{"s":"∠2 and ∠3 are supplementary","r":["Consecutive Interior Angles Theorem"],"why":"∠2 and ∠3 are between a and b on the same side of d, and a ∥ b: consecutive interior angles.","fixed":false},{"s":"m∠2 + m∠3 = 180","r":["Definition of supplementary angles"],"why":"Supplementary angles add to 180°.","fixed":false},{"s":"∠1 ≅ ∠2","r":["Corresponding Angles Postulate"],"why":"∠1 and ∠2 are in matching spots at the crossings of a with c and d, and c ∥ d.","fixed":false},{"s":"m∠1 = m∠2","r":["Definition of congruent angles","Definition of congruence"],"why":"Congruent angles have equal measures.","fixed":false},{"s":"m∠1 + m∠3 = 180","r":["Substitution Property of Equality","Transitive Property of Equality"],"why":"Replace m∠2 with m∠1 in line 3.","fixed":false},{"s":"∠1 and ∠3 are supplementary","r":["Definition of supplementary angles"],"why":"Their measures add to 180°.","fixed":false}],"steps":"Get 180 from the first pair, swap in the equal angle, then finish with the definition.","img":"pp5","num":"Proof 5"}]},{"title":"Find the mistakes","note":"From the review slides: each proof below has wrong reasons. Find the error.","probs":[{"t":"mc","q":"<b>Mistake 1.<\/b> Look at line 2 of this proof (a ∥ b, c ∥ d; ∠2 and ∠3 are between the parallel lines on the same side of d).<table class='tbl'><tr><th>Statements<\/th><th>Reasons<\/th><\/tr><tr><td>1) a ∥ b, c ∥ d<\/td><td>1) Given<\/td><\/tr><tr><td>2) ∠2 &amp; ∠3 are supplementary<\/td><td>2) <b>Alternate Interior Angles Theorem<\/b><\/td><\/tr><tr><td>3) m∠2 + m∠3 = 180<\/td><td>3) <b>Definition of complementary angles<\/b><\/td><\/tr><tr><td>4) ∠1 ≅ ∠2<\/td><td>4) Corresponding Angles Postulate<\/td><\/tr><tr><td>5) m∠1 = m∠2<\/td><td>5) Definition of congruent angles<\/td><\/tr><tr><td>6) m∠1 + m∠3 = 180<\/td><td>6) <b>Transitive Property of Equality<\/b><\/td><\/tr><tr><td>7) ∠1 &amp; ∠3 are supplementary<\/td><td>7) Definition of supplementary angles<\/td><\/tr><\/table>What should the reason in line 2 be?","opts":["Consecutive Interior Angles Theorem","Alternate Interior Angles Theorem","Corresponding Angles Postulate","Linear Pair Postulate"],"ans":0,"steps":"∠2 and ∠3 are between the lines and on the same side of the transversal: <b>consecutive interior<\/b>, which are supplementary. Alternate interior angles would be congruent, not supplementary.","img":"pp5","num":"Mistake 1"},{"t":"mc","q":"<b>Mistake 2.<\/b> Line 3 turns \"supplementary\" into m∠2 + m∠3 = 180. What should the reason in line 3 be?","opts":["Definition of supplementary angles","Definition of complementary angles","Angle Addition Postulate","Addition Property of Equality"],"ans":0,"steps":"Supplementary angles add to 180°. \"Complementary\" would add to 90°.","img":"pp5","num":"Mistake 2"},{"t":"mc","q":"<b>Mistake 3.<\/b> Line 6 replaces m∠2 with m∠1 in the equation m∠2 + m∠3 = 180. What should the reason be?","opts":["Substitution Property of Equality","Transitive Property of Equality","Reflexive Property of Equality","Distributive Property"],"ans":0,"steps":"You swapped one name for an equal quantity inside an equation: <b>Substitution<\/b>. Transitive links two equalities in a chain (a = b and b = c).","img":"pp5","num":"Mistake 3"},{"t":"proof","q":"<b>Review slide A.<\/b> Given: a ∥ b. Prove: m∠9 + m∠14 = 180°.","rows":[{"s":"a ∥ b","r":["Given"],"why":"Given","fixed":true},{"s":"∠9 ≅ ∠13","r":["Corresponding Angles Postulate"],"why":"∠9 and ∠13 are in matching spots at the crossings of d with a and b.","fixed":false},{"s":"m∠9 = m∠13","r":["Definition of congruent angles","Definition of congruence"],"why":"Congruent angles have equal measures.","fixed":false},{"s":"∠13 and ∠14 are supplementary","r":["Linear Pair Postulate"],"why":"∠13 and ∠14 are side by side on line b.","fixed":false},{"s":"m∠13 + m∠14 = 180","r":["Definition of supplementary angles"],"why":"Supplementary angles add to 180°.","fixed":false},{"s":"m∠9 + m∠14 = 180","r":["Substitution Property of Equality","Transitive Property of Equality"],"why":"Replace m∠13 with m∠9.","fixed":false}],"steps":"Same idea as Proof 4: use CAP to move the angle, then a linear pair to get 180.","img":"sl4","num":"Review slide A"},{"t":"proof","q":"<b>Review slide B.<\/b> Given: g ∥ h, p ∥ r. Prove: ∠1 ≅ ∠2.","rows":[{"s":"g ∥ h, p ∥ r","r":["Given"],"why":"Given","fixed":true},{"s":"∠1 ≅ ∠3","r":["Corresponding Angles Postulate"],"why":"∠1 and ∠3 are in matching spots (upper left) where p crosses g and h, and g ∥ h.","fixed":false},{"s":"∠3 ≅ ∠2","r":["Alternate Exterior Angles Theorem"],"why":"∠3 and ∠2 are outside the lines p and r on opposite sides of h, and p ∥ r.","fixed":false},{"s":"∠1 ≅ ∠2","r":["Transitive Property of Congruence"],"why":"Chain the two congruences. (The slide writes \"Transitive POE\"; for ≅ statements the name is Property of Congruence.)","fixed":false}],"steps":"Middle angle: ∠3.","img":"sl5","num":"Review slide B"}]}],"new":false},{"id":"Review","title":"Quiz Review Sheet","blurb":"Your teacher's 3.1 to 3.2 review: all seven parts, the four proofs, and a cheat sheet.","topics":[{"h":"Cheat sheet: everything on the 3.1 and 3.2 quiz","body":"<table class=\"tbl\"><tr><th>Topic<\/th><th>What to remember<\/th><\/tr>\n<tr><td><b>Line pairs<\/b><\/td><td>Parallel = coplanar, never meet. Skew = <b>not<\/b> coplanar, never meet. Perpendicular = meet at 90°. Parallel planes never meet.<\/td><\/tr>\n<tr><td><b>Postulates 13 and 14<\/b><\/td><td>A line and a point not on it: <b>exactly one<\/b> parallel line and <b>exactly one<\/b> perpendicular line through the point.<\/td><\/tr>\n<tr><td><b>Naming pairs<\/b><\/td><td>exterior/exterior + opposite sides = alt ext. interior/interior + opposite = alt int. interior/interior + same side = consecutive int. interior/exterior + same side = corresponding.<\/td><\/tr>\n<tr><td><b>If the lines are parallel<\/b><\/td><td>corresponding, alt int, alt ext: <b>equal<\/b>. consecutive interior: <b>add to 180<\/b>. Not true without parallel lines.<\/td><\/tr>\n<tr><td><b>Always true (no parallel needed)<\/b><\/td><td>vertical angles are equal; a linear pair adds to 180.<\/td><\/tr>\n<tr><td><b>Solving for x<\/b><\/td><td>Decide equal or supplementary, write the equation, solve, then <b>check<\/b> by plugging back in.<\/td><\/tr>\n<tr><td><b>Reasons for proofs<\/b><\/td><td>Given; Corresponding Angles Postulate; Alternate Interior/Exterior Angles Theorem; Consecutive Interior Angles Theorem; Linear Pair Postulate; Vertical Angles Congruence Theorem; Transitive Property of Congruence; Definition of congruent / supplementary angles; Substitution Property of Equality.<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Part VI (always / sometimes / never):<\/b> \"always\" needs a rule with no exceptions. If one case (like a pair of 90° angles) breaks it, the answer is \"sometimes\".<\/div>","check":{"t":"mc","q":"Alternate exterior angles are ______ congruent.","opts":["sometimes","always","never","only for skew lines"],"ans":0,"steps":"They are congruent only when the two lines are <b>parallel<\/b>. So the answer is <b>sometimes<\/b>."}},{"h":"How to attack a proof on this quiz","body":"<ol><li>Read the Given and Prove. Mark the angles on the figure.<\/li>\n<li>Pick a <b>middle angle<\/b> that connects what you know to what you want. (Proofs 1, 3 and the Find-the-mistakes proofs use this.)<\/li>\n<li>For each link, name the pair type, then the rule for that type.<\/li>\n<li>If the Prove says <b>supplementary<\/b>: get an equation that adds to 180, <b>substitute<\/b> the equal angle, finish with the <b>definition of supplementary angles<\/b>.<\/li>\n<li>End with <b>Transitive Property of Congruence<\/b> (for ≅) or Substitution (for equations).<\/li><\/ol>\n<div class=\"tip\"><b>Common mix-up:<\/b> \"alternate interior\" and \"alternate exterior\" are easy to swap. Interior means <i>between<\/i> the two lines; exterior means <i>outside<\/i> them.<\/div>","check":{"t":"mc","q":"A proof line says \"∠8 ≅ ∠1\" for two angles that are outside the parallel lines, on opposite sides of the transversal. The reason is...","opts":["Alternate Exterior Angles Theorem","Alternate Interior Angles Theorem","Corresponding Angles Postulate","Definition of congruent angles"],"ans":0,"steps":"Outside the lines and opposite sides = <b>Alternate Exterior Angles Theorem<\/b>."}}],"sets":[{"title":"Quiz Review sheet (all 37 problems)","note":"Parts I to VII and the four proofs, with the key's mistakes corrected where noted.","probs":[{"t":"text","q":"<b>Part I, #1.<\/b> ∠1 and ∠__ are vertical angles. (number only)","accept":["6"],"steps":"∠1 is opposite ∠6 where the two lines cross.","show":"6","img":"q_f1","num":"Part I #1"},{"t":"text","q":"<b>Part I, #2.<\/b> ∠2 and ∠__ are corresponding angles. (number only)","accept":["4"],"steps":"∠2 is in the lower left at the top crossing, and ∠4 is in the lower left at the bottom crossing.","show":"4","img":"q_f1","num":"Part I #2"},{"t":"text","q":"<b>Part I, #3.<\/b> ∠6 and ∠__ are alternate interior angles. (number only)","accept":["3"],"steps":"∠6 is between the lines on the right of the transversal; ∠3 is between the lines on the left.","show":"3","img":"q_f1","num":"Part I #3"},{"t":"mc","q":"<b>Part I, #4.<\/b> ∠7 and ∠6 are ______ angles.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":3,"steps":"Both between the lines and on the same side of the transversal: consecutive interior.","img":"q_f1","num":"Part I #4"},{"t":"mc","q":"<b>Part I, #5.<\/b> ∠5 and ∠4 are ______ angles.","opts":["corresponding angles","alternate interior angles","alternate exterior angles","consecutive interior angles"],"ans":2,"steps":"Both outside the lines, on opposite sides of t d m∠16 = 3x + 40, find x. (number only)","accept":["24","x=24"],"steps":"∠5 ≅ ∠9 (corresponding, m ∥ n) and ∠16 ≅ ∠12 (corresponding, j ∥ k). ∠9 and ∠12 are a linear pair, so m∠5 + m∠16 = 180: 5x + 60 = 180 and x = 24.","show":"24","img":"q_f3","sec":1},{"t":"mc","q":"Given: m ∥ n. Which reason justifies \"∠2 and ∠8 are supplementary\"?","opts":["Consecutive Interior Angles Theorem","Alternate Interior Angles Theorem","Corresponding Angles Postulate","Linear Pair Postulate"],"ans":0,"steps":"Between the lines on the same side: consecutive interior angles.","img":"q_f7","sec":1},{"t":"text","q":"Find x. The lines are parallel. (number only)","accept":["101"],"steps":"Alternate interior angles are congruent: x = 101.","show":"101","img":"hw_a4","sec":1},{"t":"text","q":"Consecutive interior angles are (3x + 77)° and (4x + 54)°. Find x. (number only)","accept":["7","x=7"],"steps":"7x + 131 = 180, so x = 7.","show":"7","img":"hw_b3","sec":1},{"t":"text","q":"Corresponding angles are (9x + 8)° and (4x + 18)°. Find x. (number only)","accept":["2","x=2"],"steps":"9x + 8 = 4x + 18, so x = 2.","show":"2","img":"hw_b4","sec":1},{"t":"text","q":"Find x and then y: (8y + 2)° and (25y − 20)° are consecutive interior angles. What is y? (number only)","accept":["6","y=6"],"steps":"(8y + 2) + (25y − 20) = 180, so 33y = 198 and y = 6.","show":"6","svg":"alg_ex3","sec":1},{"t":"mc","q":"Which reason justifies \"∠1 ≅ ∠2\" if ∠1 and ∠2 are opposite each other where two lines cross?","opts":["Vertical Angles Congruence Theorem","Corresponding Angles Postulate","Alternate Interior Angles Theorem","Linear Pair Postulate"],"ans":0,"steps":"Opposite angles at a crossing: <b>Vertical Angles Congruence Theorem<\/b>.","sec":1},{"t":"tf","q":"If two parallel lines are cut by a transversal, alternate interior angles are congruent.","opts":["True","False"],"ans":0,"steps":"<b>Alternate Interior Angles Theorem<\/b>.","sec":1}]}],"flash":[{"sec":0,"front":"Parallel lines","back":"<b>Coplanar<\/b> lines that do <b>not intersect<\/b>."},{"sec":0,"front":"Skew lines","back":"<b>Non-coplanar<\/b> lines that do not intersect."},{"sec":0,"front":"Perpendicular lines","back":"Lines that intersect to form <b>right angles<\/b>."},{"sec":0,"front":"Parallel planes","back":"Planes that <b>do not intersect<\/b>."},{"sec":0,"front":"Lines that do not intersect are either...","back":"<b>Parallel<\/b> or <b>skew<\/b>."},{"sec":0,"front":"Transversal","back":"A line that <b>intersects two or more coplanar lines<\/b> at <b>different points<\/b>."},{"sec":0,"front":"Exterior angles","back":"The angles <b>outside<\/b> the two lines cut by a transversal."},{"sec":0,"front":"Interior angles","back":"The angles <b>between<\/b> the two lines cut by a transversal."},{"sec":0,"front":"Corresponding angles","back":"One interior, one exterior, on the <b>same side<\/b> of the transversal. They are in matching spots (for example both upper left)."},{"sec":0,"front":"Alternate interior angles","back":"Both <b>interior<\/b>, on <b>opposite sides<\/b> of the transversal."},{"sec":0,"front":"Alternate exterior angles","back":"Both <b>exterior<\/b>, on <b>opposite sides<\/b> of the transversal."},{"sec":0,"front":"Consecutive interior angles (same-side interior)","back":"Both <b>interior<\/b>, on the <b>same side<\/b> of the transversal."},{"sec":0,"front":"Vertical angles vs. linear pair","back":"Vertical: <b>opposite<\/b> each other where two lines cross. Linear pair: <b>side by side<\/b> on a straight line, adding to 180°."},{"sec":0,"front":"Postulate 13: Parallel Postulate","back":"Given a line and a point not on it, there is <b>exactly one<\/b> line through the point <b>parallel<\/b> to the line."},{"sec":0,"front":"Postulate 14: Perpendicular Postulate","back":"Given a line and a point not on it, there is <b>exactly one<\/b> line through the point <b>perpendicular<\/b> to the line."},{"sec":0,"front":"Can you assume lines are perpendicular because they look it?","back":"No. Perpendicular must be <b>stated<\/b> or shown with a <b>right-angle mark<\/b>."},{"sec":0,"front":"Skew or parallel? (the one-question test)","back":"Both never meet. If one plane holds both lines: <b>parallel<\/b>. If no plane holds both: <b>skew<\/b>."},{"sec":1,"front":"Postulate 15: Corresponding Angles Postulate","back":"If two <b>parallel<\/b> lines are cut by a transversal, corresponding angles are <b>congruent<\/b>."},{"sec":1,"front":"Theorem 3.1: Alternate Interior Angles Theorem","back":"If two <b>parallel<\/b> lines are cut by a transversal, alternate interior angles are <b>congruent<\/b>."},{"sec":1,"front":"Theorem 3.2: Alternate Exterior Angles Theorem","back":"If two <b>parallel<\/b> lines are cut by a transversal, alternate exterior angles are <b>congruent<\/b>."},{"sec":1,"front":"Theorem 3.3: Consecutive Interior Angles Theorem","back":"If two <b>parallel<\/b> lines are cut by a transversal, consecutive interior angles are <b>supplementary<\/b>."},{"sec":1,"front":"Which parallel-line angle pairs are equal, and which add to 180?","back":"<b>Equal:<\/b> corresponding, alternate interior, alternate exterior. <b>Add to 180°:<\/b> consecutive interior (and consecutive exterior)."},{"sec":1,"front":"Do these rules work if the lines are not parallel?","back":"No. Every rule needs <b>parallel lines<\/b>. Without them you can only name the pair."},{"sec":1,"front":"Solving for x: equal or add to 180?","back":"Equal pairs: set the two expressions equal. Consecutive interior or linear pair: set their sum equal to <b>180<\/b>."},{"sec":1,"front":"Reason for \"∠1 ≅ ∠3\" when ∠1 and ∠3 are opposite at a crossing","back":"Vertical Angles Congruence Theorem."},{"sec":1,"front":"Reason for \"∠3 and ∠7 are supplementary\" when they are side by side on a line","back":"Linear Pair Postulate."},{"sec":1,"front":"Reason for linking two congruences (∠1 ≅ ∠2, ∠2 ≅ ∠3 so ∠1 ≅ ∠3)","back":"Transitive Property of Congruence."},{"sec":1,"front":"Reason for swapping an equal angle into
